# yamllint disable rule:braces
# yamllint disable rule:syntax
{{- range $name, $svc := .Values.services }}
{{- $fullName := printf "%s-g2-%s" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- $secretName := default $fullName $svc.secretName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $fullName }}"
  labels:
    app.kubernetes.io/name: "{{ $fullName }}"
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
    app.kubernetes.io/component: "{{ $name }}"
spec:
  replicas: {{ default 1 $svc.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ $fullName }}"
      app.kubernetes.io/instance: "{{ $.Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ $fullName }}"
        app.kubernetes.io/instance: "{{ $.Release.Name }}"
        app.kubernetes.io/component: "{{ $name }}"
    spec:
      {{- if $svc.serviceAccountName }}
      serviceAccountName: "{{ $svc.serviceAccountName }}"
      {{- end }}
      {{- if $svc.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $svc.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $svc.podSecurityContext }}
      securityContext:
        {{- toYaml $svc.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: "{{ $name }}"
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: "{{ $svc.image.pullPolicy }}"
          {{- if $svc.command }}
          command:
            {{- toYaml $svc.command | nindent 12 }}
          {{- end }}
          {{- if $svc.args }}
          args:
            {{- toYaml $svc.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
              protocol: TCP
          {{- if $svc.securityContext }}
          securityContext:
            {{- toYaml $svc.securityContext | nindent 12 }}
          {{- end }}
          {{- if $svc.resources }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- end }}
          {{- if or $svc.env $svc.secrets $svc.secretKeys }}
          env:
            {{- range $key, $value := $svc.env }}
            - name: "{{ $key }}"
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $_ := $svc.secrets }}
            - name: "{{ $key }}"
              valueFrom:
                secretKeyRef:
                  name: "{{ $secretName }}"
                  key: "{{ $key }}"
            {{- end }}
            {{- range $key := $svc.secretKeys }}
            - name: "{{ $key }}"
              valueFrom:
                secretKeyRef:
                  name: "{{ $secretName }}"
                  key: "{{ $key }}"
            {{- end }}
          {{- end }}
          {{- if $svc.envFrom }}
          envFrom:
            {{- toYaml $svc.envFrom | nindent 12 }}
            {{- if $svc.secretName }}
            - secretRef:
                name: "{{ $svc.secretName }}"
            {{- end }}
          {{- else if $svc.secretName }}
          envFrom:
            - secretRef:
                name: "{{ $svc.secretName }}"
          {{- end }}
          {{- if $svc.livenessProbe }}
          livenessProbe:
            {{- toYaml $svc.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $svc.readinessProbe }}
          readinessProbe:
            {{- toYaml $svc.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $svc.startupProbe }}
          startupProbe:
            {{- toYaml $svc.startupProbe | nindent 12 }}
          {{- end }}
---
{{- end }}
