# yamllint disable rule:braces
# yamllint disable rule:syntax
{{- if .Values.grafanaDatasources.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: {{ .Values.grafanaDatasources.prometheus.url }}
        access: proxy
        isDefault: true
        editable: true
{{- end }}
