# yamllint disable rule:braces
# yamllint disable rule:syntax
{{- if .Values.monitoring.enabled }}
{{- if .Values.monitoring.kafkaExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: "{{ .Values.monitoring.kafkaExporter.image }}"
          args:
            - "--kafka.server={{ .Values.monitoring.kafkaExporter.kafkaServer }}"
            - "--kafka.version=3.7.0"
            - "--web.listen-address=:9308"
            - "--topic.filter=.*"
            - "--group.filter=.*"
          ports:
            - name: metrics
              containerPort: 9308
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9308
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.monitoring.kafkaExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: kafka-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
  selector:
    app: kafka-exporter
---
{{- end }}
{{- if .Values.monitoring.postgresExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: "{{ .Values.monitoring.postgresExporter.image }}"
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  key: dsn
                  name: "{{ .Values.monitoring.postgresExporter.secretName }}"
          ports:
            - name: metrics
              containerPort: 9187
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.monitoring.postgresExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
  selector:
    app: postgres-exporter
---
{{- end }}
{{- if .Values.monitoring.redisExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: "{{ .Values.monitoring.redisExporter.image }}"
          env:
            - name: REDIS_ADDR
              value: "{{ .Values.monitoring.redisExporter.redisAddr }}"
          ports:
            - name: metrics
              containerPort: 9121
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.monitoring.redisExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
  selector:
    app: redis-exporter
---
{{- end }}
{{- if .Values.monitoring.kubeStateMetrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: "{{ .Values.monitoring.kubeStateMetrics.image }}"
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.monitoring.kubeStateMetrics.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: kube-state-metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
  selector:
    app: kube-state-metrics
---
{{- end }}
{{- if .Values.monitoring.kongMetrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kong-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: kong-metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.monitoring.kongMetrics.port }}
      targetPort: {{ .Values.monitoring.kongMetrics.port }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: kong
---
{{- end }}
{{- if .Values.monitoring.nodeExporter.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: node-exporter
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: node-exporter
          image: "{{ .Values.monitoring.nodeExporter.image }}"
          args:
            - --path.rootfs=/host
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
          resources:
            {{- toYaml .Values.monitoring.nodeExporter.resources | nindent 12 }}
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
      volumes:
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: node-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    app: node-exporter
{{- end }}
{{- end }}
