# yamllint disable rule:braces
# yamllint disable rule:syntax
{{- if .Values.networkPolicies.allowIngestionToHivemq.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingestion-to-hivemq
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    {{- toYaml .Values.networkPolicies.allowIngestionToHivemq.podSelector | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    {{- toYaml .Values.networkPolicies.allowIngestionToHivemq.ingress | nindent 4 }}
{{- end }}
