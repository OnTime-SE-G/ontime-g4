# Umbrella values for the transit-platform chart.
# Deployment Trigger: 2026-05-07T11:24:00Z
# Keep secrets out of git; use external secret managers in production.

global:
  security:
    allowInsecureImages: true
  postgresql:
    auth:
      postgresPassword: "postgres-password-placeholder"
      password: "user-password-placeholder"

postgresql:
  # Bitnami PostgreSQL values
  auth:
    username: g4_app
    database: g4_platform
    existingSecret: transit-platform-postgresql-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  image:
    registry: docker.io
    repository: postgis/postgis
    tag: 16-3.4
    pullPolicy: Always
  networkPolicy:
    enabled: false
  primary:
    persistence:
      size: 8Gi


kafka:
  # Bitnami Kafka values — KRaft mode (no ZooKeeper needed)
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: latest
    pullPolicy: Always
  networkPolicy:
    enabled: false
  auth:
    enabled: false
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
  persistence:
    # Staging-sized volume.
    size: 8Gi

redis:
  # Bitnami Redis values
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: latest
    pullPolicy: Always
  networkPolicy:
    enabled: false
  master:
    persistence:
      size: 2Gi

  replica:
    replicaCount: 0

kong:
  # Kong ingress controller/gateway values (dbless mode with declarative config)
  database: "off"
  ingressController:
    enabled: true
  proxy:
    type: LoadBalancer
  # Declarative config: routes to G2 microservices and platform services
  admin:
    # Kong admin API disabled; config is declarative only
    enabled: false
  # Volume mount for declarative config file
  extraVolumes:
    - name: kong-declarative-config
      configMap:
        name: '{{ include "transit-platform.fullname" . }}-kong-declarative'
  extraVolumeMounts:
    - name: kong-declarative-config
      mountPath: /etc/kong
      readOnly: true
  # Environment for dbless mode
  env:
    KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
    KONG_PROXY_ACCESS_LOG: /dev/stdout
    KONG_ADMIN_ACCESS_LOG: /dev/stdout
    KONG_PROXY_ERROR_LOG: /dev/stderr
    KONG_ADMIN_ERROR_LOG: /dev/stderr
  # ConfigMap containing Kong declarative configuration
  configMap:
    enabled: true
    config: |
      _format_version: "3.0"
      _transform: true

      services:
        - name: api-gateway
          host: transit-platform-g2-api-gateway
          port: 8000
          protocol: http
          routes:
            - name: api-v1-routes
              paths:
                - /api/v1
                - /api/v1/*
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - OPTIONS

        - name: websocket-service
          host: transit-platform-g2-websocket-service
          port: 8004
          protocol: http
          routes:
            - name: websocket-live
              paths:
                - /v1/live
              methods:
                - GET
                - POST

        - name: keycloak
          host: transit-platform-keycloak
          port: 80
          protocol: http
          routes:
            - name: keycloak-auth
              paths:
                - /auth
                - /auth/*
              methods:
                - GET
                - POST

        - name: grafana
          host: transit-platform-grafana
          port: 80
          protocol: http
          routes:
            - name: grafana-dashboard
              paths:
                - /grafana
                - /grafana/*
              strip_path: true

        - name: health-service
          host: transit-platform-g2-api-gateway
          port: 8000
          protocol: http
          routes:
            - name: health
              paths:
                - /health
              methods:
                - GET

      consumers: []

keycloak:
  # Bitnami Keycloak values
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
    tag: latest
    pullPolicy: Always
  networkPolicy:
    enabled: false
  ingress:
    # Kong will route traffic; keep Keycloak ingress disabled.
    enabled: false
  auth:
    adminUser: admin
    existingSecret: transit-platform-keycloak-auth
    passwordSecretKey: admin-password

influxdb:
  # Bitnami InfluxDB values
  image:
    registry: docker.io
    repository: bitnamilegacy/influxdb
    tag: latest
    pullPolicy: Always
  networkPolicy:
    enabled: false
  auth:
    enabled: true
    adminUser: admin
    existingSecret: transit-platform-influxdb-auth
  persistence:
    # Staging-sized volume.
    size: 8Gi

prometheus:
  # Bitnami Prometheus values
  server:
    image:
      registry: docker.io
      repository: bitnamilegacy/prometheus
      tag: latest
      pullPolicy: Always
  alertmanager:
    image:
      registry: docker.io
      repository: bitnamilegacy/alertmanager
      tag: latest
      pullPolicy: Always
  ingress:
    # Kong will route traffic; keep Prometheus ingress disabled.
    enabled: false
  networkPolicy:
    enabled: false


grafana:
  # Bitnami Grafana values
  image:
    registry: docker.io
    repository: bitnamilegacy/grafana
    tag: latest
    pullPolicy: Always
  ingress:
    # Kong will route traffic; keep Grafana ingress disabled.
    enabled: false
  networkPolicy:
    enabled: false

  admin:
    user: admin
    existingSecret: transit-platform-grafana-admin
    existingSecretPasswordKey: admin-password

mosquitto:
  # Local mosquitto chart values
  persistence:
    enabled: true
    # Staging-sized volume.
    size: 2Gi

flyway-job:
  enabled: true
  # Local flyway job values
  image:
    repository: flyway/flyway
    tag: "10.15"
    pullPolicy: IfNotPresent
  env:
    FLYWAY_URL: "jdbc:postgresql://transit-platform-postgresql:5432/g4_platform"
    FLYWAY_USER: g4_app
  envFromSecret: transit-platform-flyway

# ─────────────────────────────────────────────────────────
# G2 Microservices
# Service URLs use Helm-generated names: transit-platform-<dep>
# G2 inter-service URLs use: transit-platform-g2-<service>
# ─────────────────────────────────────────────────────────
g2-services:
  services:
    api-gateway:
      image:
        repository: ghcr.io/ontime-se-g/ontime-g2/api-gateway
        tag: sha-ed25d77
        pullPolicy: IfNotPresent
      containerPort: 8000
      service:
        type: ClusterIP
        port: 8000
      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
      env:
        REDIS_URL: "redis://transit-platform-redis-master:6379/0"
        ROUTE_SERVICE_URL: "http://transit-platform-g2-route-service:8002"
        FLEET_SERVICE_URL: "http://transit-platform-g2-fleet-management-service:8003"
      secretName: g2-api-gateway-secret
      secretKeys:
        - DATABASE_URL

    route-service:
      image:
        repository: ghcr.io/ontime-se-g/ontime-g2/route-service
        tag: sha-ed25d77
        pullPolicy: IfNotPresent
      containerPort: 8002
      service:
        type: ClusterIP
        port: 8002
      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
      env: {}
      secretName: g2-route-service-secret
      secretKeys:
        - DATABASE_URL

    fleet-management-service:
      image:
        repository: ghcr.io/ontime-se-g/ontime-g2/fleet-management-service
        tag: sha-ed25d77
        pullPolicy: IfNotPresent
      containerPort: 8003
      service:
        type: ClusterIP
        port: 8003
      livenessProbe:
        httpGet:
          path: /health/live
          port: http
        initialDelaySeconds: 15
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health/ready
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
      env:
        ROUTE_SERVICE_URL: "http://transit-platform-g2-route-service:8002"
        KAFKA_BROKER_URL: "transit-platform-kafka:9092"
        KAFKA_TRIP_LIFECYCLE_TOPIC: "trip.lifecycle"
      secretName: g2-fleet-management-secret
      secretKeys:
        - DATABASE_URL

    ingestion:
      image:
        repository: ghcr.io/ontime-se-g/ontime-g2/ingestion
        tag: sha-ed25d77
        pullPolicy: IfNotPresent
      containerPort: 8001
      service:
        type: ClusterIP
        port: 8001
      livenessProbe:
        httpGet:
          path: /health/live
          port: http
        initialDelaySeconds: 20
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health/ready
          port: http
        initialDelaySeconds: 15
        periodSeconds: 10
      env:
        MQTT_BROKER_HOST: "transit-platform-mosquitto"
        MQTT_BROKER_PORT: "1883"
        MQTT_TOPIC_PATTERN: "transport/bus/+/location"
        MQTT_HEARTBEAT_TOPIC_PATTERN: "transport/bus/+/heartbeat"
        MQTT_TLS_ENABLED: "false"
        MQTT_CLIENT_ID: "ontime-ingestion-service"
        KAFKA_BROKER_URL: "transit-platform-kafka:9092"
        INGESTION_KAFKA_RAW_TOPIC: "transport-telemetry-raw"
        INGESTION_KAFKA_DLQ_TOPIC: "transport-telemetry-dlq"
        INGESTION_KAFKA_TRIP_LIFECYCLE_TOPIC: "trip.lifecycle"
        INGESTION_TRIP_CACHE_CONSUMER_GROUP: "ingestion-trip-cache"
        INGESTION_REQUIRE_ACTIVE_TRIP: "true"
        INGESTION_TRIP_CACHE_REBUILD_TIMEOUT_SECONDS: "60.0"
        INGESTION_STARTUP_BUFFER_MAX_MESSAGES: "1000"
        INGESTION_SERVICE_PORT: "8001"
        INGESTION_MIN_MESSAGE_INTERVAL_SECONDS: "3.0"
        INGESTION_MIN_EVENT_INTERVAL_SECONDS: "1.0"
        INGESTION_MAX_FUTURE_SKEW_SECONDS: "30.0"
        INGESTION_MAX_STALE_AGE_SECONDS: "86400.0"
        INGESTION_DUPLICATE_CACHE_SIZE: "100"
      secrets: {}

    websocket-service:
      image:
        repository: ghcr.io/ontime-se-g/ontime-g2/websocket-service
        tag: sha-ed25d77
        pullPolicy: IfNotPresent
      containerPort: 8004
      service:
        type: ClusterIP
        port: 8004
      livenessProbe:
        httpGet:
          path: /health/live
          port: http
        initialDelaySeconds: 15
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health/ready
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
      env:
        REDIS_URL: "redis://transit-platform-redis-master:6379"
        FLEET_CHANNEL: "fleet:live"
        ETA_CHANNEL: "eta:live"
      secrets: {}

    anomaly-service:
      image:
        repository: ghcr.io/ontime-se-g/ontime-g2/anomaly-service
        tag: sha-ed25d77
        pullPolicy: IfNotPresent
      containerPort: 8006
      service:
        type: ClusterIP
        port: 8006
      livenessProbe:
        httpGet:
          path: /health/live
          port: http
        initialDelaySeconds: 15
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health/ready
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
      env:
        KAFKA_BROKER_URL: "transit-platform-kafka:9092"
        KAFKA_CLEANED_TOPIC: "transport-telemetry-cleaned"
        KAFKA_DLQ_TOPIC: "transport-telemetry-dlq"
        KAFKA_ANOMALY_TOPIC: "transport-anomaly-alerts"
        KAFKA_DLQ_GROUP_ID: "anomaly-service-dlq-group"
        ROUTE_SERVICE_URL: "http://transit-platform-g2-route-service:8002"
        COMMUNICATION_LOSS_CHECK_INTERVAL_SECONDS: "60"
        COMMUNICATION_LOSS_THRESHOLD_SECONDS: "180"
        INACTIVE_TRIP_DLQ_THRESHOLD_COUNT: "3"
        INACTIVE_TRIP_DLQ_WINDOW_SECONDS: "60"
        INACTIVE_TRIP_DLQ_COOLDOWN_SECONDS: "300"
      secrets: {}

    stream-processing:
      image:
        repository: ghcr.io/ontime-se-g/ontime-g2/stream-processing
        tag: sha-ed25d77
        pullPolicy: IfNotPresent
      containerPort: 8081
      service:
        type: ClusterIP
        port: 8081
      livenessProbe:
        tcpSocket:
          port: 8081
        initialDelaySeconds: 30
        periodSeconds: 30
      readinessProbe:
        tcpSocket:
          port: 8081
        initialDelaySeconds: 20
        periodSeconds: 10
      env:
        KAFKA_BROKER_URL: "transit-platform-kafka:9092"
        KAFKA_RAW_TOPIC: "transport-telemetry-raw"
        KAFKA_CLEANED_TOPIC: "transport-telemetry-cleaned"
        KAFKA_LIFECYCLE_TOPIC: "trip.lifecycle"
        REDIS_HOST: "transit-platform-redis-master"
        REDIS_PORT: "6379"
        INFLUXDB_URL: "http://transit-platform-influxdb:8086"
        INFLUXDB_ORG: "ontime"
        INFLUXDB_BUCKET: "telemetry"
        ROUTE_SERVICE_URL: "http://transit-platform-g2-route-service:8002"
      secretName: g2-stream-processing-secret
      secretKeys:
        - INFLUXDB_TOKEN
