# hivemq-configmap.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: hivemq-config
  namespace: transit-edge
data:
  config.xml: |
    <?xml version="1.0"?>
    <hivemq>
        <listeners>
            <!-- Internal plaintext listener for cluster/bridge -->
            <tcp-listener>
                <port>1883</port>
                <bind-address>0.0.0.0</bind-address>
            </tcp-listener>
            <!-- External TLS listener for G1 devices -->
            <tls-tcp-listener>
                <port>8883</port>
                <bind-address>0.0.0.0</bind-address>
                <tls>
                    <keystore>
                        <path>/opt/hivemq/certs/keystore.p12</path>
                        <password>hivemq123</password>
                        <private-key-password>hivemq123</private-key-password>
                    </keystore>
                </tls>
            </tls-tcp-listener>
        </listeners>
        <mqtt>
            <queued-messages>
                <max-queue-size>10000</max-queue-size>
            </queued-messages>
        </mqtt>
    </hivemq>