apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: transit-platform

# automatically creates the ConfigMap by reading kong.yaml file
configMapGenerator:
  - name: kong-declarative-config
    files:
      - kong.yml=kong.yaml

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml



   