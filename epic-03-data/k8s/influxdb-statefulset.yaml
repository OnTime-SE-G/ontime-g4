---
apiVersion: v1
kind: ConfigMap
metadata:
  name: influxdb-init-script
  namespace: transit-data
data:
  setup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    ORG="${DOCKER_INFLUXDB_INIT_ORG:-transit-org}"
    TOKEN="${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:?missing InfluxDB admin token}"
    AGGREGATE_BUCKET="gps-aggregates"
    G2_ORG="ontime"
    G2_BUCKET="telemetry"

    until influx ping --host http://localhost:8086 >/dev/null 2>&1; do
      sleep 2
    done

    if ! influx bucket list --org "$ORG" --token "$TOKEN" | awk 'NR > 1 {print $2}' | grep -qx "$AGGREGATE_BUCKET"; then
      influx bucket create \
        --name "$AGGREGATE_BUCKET" \
        --org "$ORG" \
        --retention 2160h \
        --token "$TOKEN"
    fi

    if ! influx org list --token "$TOKEN" | awk 'NR > 1 {print $2}' | grep -qx "$G2_ORG"; then
      influx org create --name "$G2_ORG" --token "$TOKEN"
    fi

    if ! influx bucket list --org "$G2_ORG" --token "$TOKEN" | awk 'NR > 1 {print $2}' | grep -qx "$G2_BUCKET"; then
      influx bucket create \
        --name "$G2_BUCKET" \
        --org "$G2_ORG" \
        --retention 168h \
        --token "$TOKEN"
    fi
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb-service
  namespace: transit-data
spec:
  type: ClusterIP
  selector:
    app: influxdb
  ports:
    - name: http
      protocol: TCP
      port: 8086
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: transit-data
spec:
  type: ClusterIP
  selector:
    app: influxdb
  ports:
    - name: http
      protocol: TCP
      port: 8086
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  namespace: transit-data
spec:
  serviceName: influxdb-service
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: setup
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: admin
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: influxdb-credentials
                  key: password
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: transit-org
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: gps-telemetry
            - name: DOCKER_INFLUXDB_INIT_RETENTION
              value: 168h
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-credentials
                  key: admin-token
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: influxdb-storage
              mountPath: /var/lib/influxdb2
            - name: init-script-volume
              mountPath: /docker-entrypoint-initdb.d/setup.sh
              subPath: setup.sh
              readOnly: true
      volumes:
        - name: init-script-volume
          configMap:
            name: influxdb-init-script
            defaultMode: 493
  volumeClaimTemplates:
    - metadata:
        name: influxdb-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 15Gi
