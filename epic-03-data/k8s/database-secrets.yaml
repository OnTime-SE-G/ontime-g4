apiVersion: v1
kind: Namespace
metadata:
  name: transit-data
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: transit-data
type: Opaque
stringData:
  username: postgres
  password: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-credentials
  namespace: transit-data
type: Opaque
stringData:
  username: admin
  password: adminpassword
  admin-token: super_secret_admin_token_123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: g2-data-connection-config
  namespace: transit-data
data:
  POSTGRES_HOST: postgres.transit-data.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ontime_db
  REDIS_HOST: redis.transit-data.svc.cluster.local
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis.transit-data.svc.cluster.local:6379
  INFLUXDB_HOST: influxdb.transit-data.svc.cluster.local
  INFLUXDB_PORT: "8086"
  INFLUXDB_URL: http://influxdb.transit-data.svc.cluster.local:8086
  INFLUXDB_ORG: ontime
  INFLUXDB_BUCKET: telemetry
---
apiVersion: v1
kind: Secret
metadata:
  name: g2-data-connection-secrets
  namespace: transit-data
type: Opaque
stringData:
  ROUTE_DATABASE_URL: postgresql://postgres:postgres@postgres.transit-data.svc.cluster.local:5432/ontime_db
  FLEET_DATABASE_URL: postgresql://postgres:postgres@postgres.transit-data.svc.cluster.local:5432/fleet_db
  INFLUXDB_TOKEN: super_secret_admin_token_123
