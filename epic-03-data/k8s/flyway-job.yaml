apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-ontime-migrations
  namespace: transit-data
data:
  V1__create_route_schema.sql: |
    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS postgis_topology;

    CREATE TABLE IF NOT EXISTS routes (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        route_number VARCHAR(50),
        name VARCHAR(150) NOT NULL UNIQUE,
        color VARCHAR(20),
        destination VARCHAR(150),
        geometry GEOMETRY(LINESTRING, 4326)
    );

    CREATE TABLE IF NOT EXISTS stops (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        name VARCHAR(120) NOT NULL UNIQUE,
        location GEOMETRY(POINT, 4326)
    );

    CREATE TABLE IF NOT EXISTS route_stop_links (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        route_id INTEGER NOT NULL REFERENCES routes(id) ON DELETE CASCADE,
        stop_id INTEGER NOT NULL REFERENCES stops(id) ON DELETE CASCADE,
        stop_order INTEGER NOT NULL,
        CONSTRAINT uq_route_stop UNIQUE (route_id, stop_id),
        CONSTRAINT uq_route_stop_order UNIQUE (route_id, stop_order)
    );
  V2__create_spatial_indexes.sql: |
    CREATE INDEX IF NOT EXISTS idx_routes_geometry_gist
        ON routes USING GIST (geometry);

    CREATE INDEX IF NOT EXISTS idx_stops_location_gist
        ON stops USING GIST (location);

    CREATE INDEX IF NOT EXISTS idx_route_stop_links_route_id
        ON route_stop_links (route_id);

    CREATE INDEX IF NOT EXISTS idx_route_stop_links_stop_id
        ON route_stop_links (stop_id);

    ANALYZE routes;
    ANALYZE stops;
    ANALYZE route_stop_links;
  V3__create_timetable_entries.sql: |
    CREATE TABLE IF NOT EXISTS timetable_entries (
        id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        route_id INTEGER NOT NULL REFERENCES routes(id) ON DELETE CASCADE,
        stop_id INTEGER NOT NULL REFERENCES stops(id) ON DELETE CASCADE,
        scheduled_arrival TIME NOT NULL,
        scheduled_departure TIME NOT NULL,
        day_mask SMALLINT NOT NULL DEFAULT 127,
        effective_from DATE NOT NULL DEFAULT CURRENT_DATE,
        effective_to DATE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CONSTRAINT chk_timetable_effective_window
            CHECK (effective_to IS NULL OR effective_to >= effective_from)
    );

    CREATE INDEX IF NOT EXISTS idx_timetable_route_stop
        ON timetable_entries (route_id, stop_id);
  R__seed_route_255.sql: |
    INSERT INTO stops (id, name, location)
    VALUES
        (25501, 'Moratuwa Bus Stand', ST_SetSRID(ST_MakePoint(79.882, 6.773), 4326)),
        (25502, 'Katubedda', ST_SetSRID(ST_MakePoint(79.886, 6.796), 4326)),
        (25503, 'Piliyandala', ST_SetSRID(ST_MakePoint(79.922, 6.801), 4326)),
        (25504, 'Kahathuduwa Entrance', ST_SetSRID(ST_MakePoint(80.086, 6.821), 4326)),
        (25505, 'Kadawatha Exit', ST_SetSRID(ST_MakePoint(79.950, 7.001), 4326)),
        (25506, 'Kadawatha Bus Stand', ST_SetSRID(ST_MakePoint(79.954, 7.005), 4326))
    ON CONFLICT (id) DO UPDATE
    SET
        name = EXCLUDED.name,
        location = EXCLUDED.location;

    INSERT INTO routes (id, route_number, name, color, destination, geometry)
    VALUES (
        255,
        '255',
        'Moratuwa - Kadawatha',
        '#2563eb',
        'Kadawatha',
        ST_GeomFromText(
            'LINESTRING(79.882 6.773, 79.886 6.796, 79.922 6.801, 80.086 6.821, 79.950 7.001, 79.954 7.005)',
            4326
        )
    )
    ON CONFLICT (id) DO UPDATE
    SET
        route_number = EXCLUDED.route_number,
        name = EXCLUDED.name,
        color = EXCLUDED.color,
        destination = EXCLUDED.destination,
        geometry = EXCLUDED.geometry;

    DELETE FROM route_stop_links
    WHERE route_id = 255;

    INSERT INTO route_stop_links (route_id, stop_id, stop_order)
    VALUES
        (255, 25501, 1),
        (255, 25502, 2),
        (255, 25503, 3),
        (255, 25504, 4),
        (255, 25505, 5),
        (255, 25506, 6);

    SELECT setval(pg_get_serial_sequence('routes', 'id'), GREATEST((SELECT MAX(id) FROM routes), 1));
    SELECT setval(pg_get_serial_sequence('stops', 'id'), GREATEST((SELECT MAX(id) FROM stops), 1));
    SELECT setval(pg_get_serial_sequence('route_stop_links', 'id'), GREATEST((SELECT MAX(id) FROM route_stop_links), 1));
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-fleet-migrations
  namespace: transit-data
data:
  V1__create_fleet_schema.sql: |
    CREATE TABLE IF NOT EXISTS buses (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        fleet_code VARCHAR(50) NOT NULL UNIQUE,
        plate_number VARCHAR(50) NOT NULL UNIQUE,
        capacity INTEGER NOT NULL DEFAULT 50,
        route_id INTEGER
    );

    CREATE INDEX IF NOT EXISTS idx_buses_route_id
        ON buses (route_id);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-g2-data-migrations
  namespace: transit-data
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: flyway-g2-data-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: flyway/flyway:10-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              flyway \
                -connectRetries=60 \
                -url="jdbc:postgresql://postgres:5432/ontime_db" \
                -user="$POSTGRES_USER" \
                -password="$POSTGRES_PASSWORD" \
                -locations="filesystem:/flyway/sql/ontime" \
                migrate

              flyway \
                -connectRetries=60 \
                -url="jdbc:postgresql://postgres:5432/fleet_db" \
                -user="$POSTGRES_USER" \
                -password="$POSTGRES_PASSWORD" \
                -locations="filesystem:/flyway/sql/fleet" \
                migrate
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          volumeMounts:
            - name: flyway-ontime-migrations
              mountPath: /flyway/sql/ontime
              readOnly: true
            - name: flyway-fleet-migrations
              mountPath: /flyway/sql/fleet
              readOnly: true
      volumes:
        - name: flyway-ontime-migrations
          configMap:
            name: flyway-ontime-migrations
        - name: flyway-fleet-migrations
          configMap:
            name: flyway-fleet-migrations
