---
apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
  namespace: transit-data
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: flyway-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: flyway
          image: flyway/flyway:10-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              /flyway/flyway -url="$FLYWAY_TRANSIT_URL" migrate
              /flyway/flyway -url="$FLYWAY_ONTIME_URL" migrate
          env:
            - name: FLYWAY_TRANSIT_URL
              value: jdbc:postgresql://postgresql-service.transit-data.svc.cluster.local:5432/transit_db
            - name: FLYWAY_ONTIME_URL
              value: jdbc:postgresql://postgresql-service.transit-data.svc.cluster.local:5432/ontime_db
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: FLYWAY_CONNECT_RETRIES
              value: "60"
            - name: FLYWAY_LOCATIONS
              value: filesystem:/flyway/sql
            - name: FLYWAY_REPEATABLE_SQL_MIGRATION_PREFIX
              value: R1
            - name: FLYWAY_EXECUTE_IN_TRANSACTION
              value: "false"
          volumeMounts:
            - name: flyway-migrations
              mountPath: /flyway/sql
              readOnly: true
      volumes:
        - name: flyway-migrations
          configMap:
            name: flyway-migrations
