---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-migrations
  namespace: transit-data
data:
  V1__create_routes.sql: |
    CREATE TABLE routes (
        route_id VARCHAR(20) PRIMARY KEY,
        route_number VARCHAR(10) NOT NULL,
        origin_halt_id VARCHAR(30),
        destination_halt_id VARCHAR(30),
        direction VARCHAR(10) NOT NULL CHECK (direction IN ('OUTBOUND', 'RETURN')),
        highway_entry_halt_id VARCHAR(30),
        route_polyline GEOMETRY(LineString, 4326) NOT NULL,
        is_active BOOLEAN NOT NULL DEFAULT TRUE,
        name_en VARCHAR(100) NOT NULL,
        name_si VARCHAR(100) NOT NULL
    );
  V2__create_halts.sql: |
    CREATE TABLE halts (
        halt_id VARCHAR(30) PRIMARY KEY,
        route_id VARCHAR(20) NOT NULL,
        halt_name_en VARCHAR(100) NOT NULL,
        halt_name_si VARCHAR(100) NOT NULL,
        location GEOMETRY(Point, 4326) NOT NULL,
        halt_sequence INT NOT NULL CHECK (halt_sequence >= 0),
        is_expressway_halt BOOLEAN NOT NULL DEFAULT FALSE,
        is_active BOOLEAN NOT NULL DEFAULT TRUE,
        CONSTRAINT uq_halts_route_sequence UNIQUE (route_id, halt_sequence),
        CONSTRAINT fk_halts_route
            FOREIGN KEY (route_id)
            REFERENCES routes(route_id)
            DEFERRABLE INITIALLY DEFERRED
    );

    ALTER TABLE routes
        ADD CONSTRAINT fk_routes_origin_halt
        FOREIGN KEY (origin_halt_id)
        REFERENCES halts(halt_id)
        DEFERRABLE INITIALLY DEFERRED;

    ALTER TABLE routes
        ADD CONSTRAINT fk_routes_destination_halt
        FOREIGN KEY (destination_halt_id)
        REFERENCES halts(halt_id)
        DEFERRABLE INITIALLY DEFERRED;

    ALTER TABLE routes
        ADD CONSTRAINT fk_routes_highway_entry_halt
        FOREIGN KEY (highway_entry_halt_id)
        REFERENCES halts(halt_id)
        DEFERRABLE INITIALLY DEFERRED;
  V3__create_vehicles.sql: |
    CREATE TABLE vehicles (
        vehicle_id VARCHAR(20) PRIMARY KEY,
        route_id VARCHAR(20) NOT NULL,
        registration_plate VARCHAR(12) UNIQUE NOT NULL,
        operator_name VARCHAR(100) NOT NULL,
        keycloak_username VARCHAR(100) UNIQUE,
        status VARCHAR(20) NOT NULL DEFAULT 'ACTIVE' CHECK (status IN ('ACTIVE', 'DEPOT', 'MAINTENANCE')),
        last_seen_utc TIMESTAMPTZ,
        CONSTRAINT fk_vehicle_route
            FOREIGN KEY (route_id)
            REFERENCES routes(route_id)
    );
  V4__create_timetable_entries.sql: |
    CREATE TABLE timetable_entries (
        entry_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        route_id VARCHAR(20) NOT NULL,
        halt_id VARCHAR(30) NOT NULL,
        scheduled_arrival TIME NOT NULL,
        scheduled_departure TIME NOT NULL,
        day_mask SMALLINT NOT NULL DEFAULT 127 CHECK (day_mask BETWEEN 1 AND 127),
        effective_from DATE NOT NULL,
        effective_to DATE,
        CONSTRAINT fk_timetable_route
            FOREIGN KEY (route_id)
            REFERENCES routes(route_id),
        CONSTRAINT fk_timetable_halt
            FOREIGN KEY (halt_id)
            REFERENCES halts(halt_id),
        CONSTRAINT ck_timetable_effective_dates
            CHECK (effective_to IS NULL OR effective_to >= effective_from)
    );
  V5__create_spatial_indexes.sql: |
    -- flyway:executeInTransaction=false

    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_halts_location_gist
        ON halts
        USING GIST ((location::geography));

    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_halts_location_geometry_gist
        ON halts
        USING GIST (location);

    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_routes_polyline_gist
        ON routes
        USING GIST (route_polyline);

    ANALYZE halts;
    ANALYZE routes;
