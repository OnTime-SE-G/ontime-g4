apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: default-mtls-transit-platform
  namespace: transit-platform
  labels:
    app.kubernetes.io/part-of: transit-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  host: "*.transit-platform.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
