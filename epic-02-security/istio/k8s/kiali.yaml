apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
    app.kubernetes.io/part-of: transit-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiali-viewer
  labels:
    app: kiali
rules:
  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - namespaces
      - nodes
      - pods
      - pods/log
      - replicationcontrollers
      - services
      - resourcequotas
    verbs: ["get", "list", "watch"]
  # Workload resources
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  # Istio networking + security CRDs (VirtualService, DestinationRule, etc.)
  - apiGroups: ["networking.istio.io", "security.istio.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Istio WasmPlugin — extensions.istio.io (missing from original → forbidden loop)
  - apiGroups: ["extensions.istio.io"]
    resources:
      - wasmplugins
    verbs: ["get", "list", "watch"]
  # Istio Telemetry CRD — telemetry.istio.io (missing from original → forbidden loop)
  - apiGroups: ["telemetry.istio.io"]
    resources:
      - telemetries
    verbs: ["get", "list", "watch"]
  # Kiali monitoring dashboards
  - apiGroups: ["monitoring.kiali.io"]
    resources:
      - monitoringdashboards
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali-viewer
  labels:
    app: kiali
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiali-viewer
subjects:
  - kind: ServiceAccount
    name: kiali
    namespace: istio-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
data:
  config.yaml: |
    auth:
      strategy: anonymous          # dev-only; no login required in Minikube
    login_token:
      # Must be 16, 24, or 32 bytes. Kiali v1.78 validates this from the config
      # file first; if absent it fatals even when strategy=anonymous.
      signing_key: "12345678901234567890123456789012"
    deployment:
      accessible_namespaces:
        - transit-platform
        - transit-data
        - transit-edge
        - transit-streaming
        - transit-intelligence
        - transit-ui
    istio_namespace: istio-system
    server:
      port: 20001
      web_root: /kiali
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
    app.kubernetes.io/part-of: transit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kiali
  template:
    metadata:
      labels:
        app: kiali
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: kiali
      containers:
        - name: kiali
          image: quay.io/kiali/kiali:v1.78
          command: ["/opt/kiali/kiali"]
          args: ["--config", "/kiali-configuration/config.yaml"]
          ports:
            - containerPort: 20001
              name: api-port
          volumeMounts:
            - name: kiali-config
              mountPath: /kiali-configuration
          env:
            - name: ACTIVE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KIALI_SIGNING_KEY
              value: "12345678901234567890123456789012"
          readinessProbe:
            httpGet:
              path: /kiali/healthz
              port: 20001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: kiali-config
          configMap:
            name: kiali
---
apiVersion: v1
kind: Service
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
spec:
  selector:
    app: kiali
  ports:
    - name: http
      port: 20001
      targetPort: 20001
