apiVersion: v1
kind: Service

metadata:
  name: kong-proxy
  labels:
    app: kong-gateway

spec:
  type: LoadBalancer  # Exposes 80 and 443 to the public internet
  selector:
    app: kong-gateway
  ports:
    - name: proxy-http
      port: 80
      targetPort: 8000
    - name: proxy-https
      port: 443
      targetPort: 8443

---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  labels:
    app: kong-gateway
spec:
  type: ClusterIP  # Explicitly locks this down to internal traffic ONLY
  selector:
    app: kong-gateway
  ports:
    - name: admin-api
      port: 8001
      targetPort: 8001
