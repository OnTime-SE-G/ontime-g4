apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: kong-gateway
  namespace: transit-platform

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kong-gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
