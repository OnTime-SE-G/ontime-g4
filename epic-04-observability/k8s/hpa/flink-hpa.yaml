apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flink-taskmanager-hpa
  namespace: transit-intelligence
spec:
    scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flink-taskmanager
    minReplicas: 2
    maxReplicas: 6
    metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: External
    external:
      metric:
        name: kafka_consumer_group_lag
        selector:
          matchLabels:
            group: raw-gps-consumer
      target:
        type: AverageValue
        averageValue: 10000
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
