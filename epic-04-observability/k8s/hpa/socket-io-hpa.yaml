apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: socket-io-hpa
  namespace: transit-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: socket-io-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
