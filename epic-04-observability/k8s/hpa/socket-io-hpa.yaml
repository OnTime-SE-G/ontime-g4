apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: socket-io-adapter-hpa
  namespace: transit-ui
spec:
    scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: socket-io-adapter
    minReplicas: 2
    maxReplicas: 8
    metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
