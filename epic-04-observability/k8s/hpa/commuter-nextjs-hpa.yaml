apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: commuter-nextjs-hpa
  namespace: transit-ui
spec:
    scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: commuter-nextjs
    minReplicas: 2
    maxReplicas: 10
    metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: socket_connections_per_pod
      target:
        type: AverageValue
        averageValue: 1000
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
