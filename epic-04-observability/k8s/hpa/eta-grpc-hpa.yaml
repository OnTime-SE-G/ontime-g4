apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eta-grpc-hpa
  namespace: transit-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eta-grpc-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
